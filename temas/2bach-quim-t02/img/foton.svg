<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 245' width='480' height='245'><defs><marker id='fl' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#1E293B'/></marker><marker id='fla' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#E11D48'/></marker></defs><line x1='30.0' y1='200.0' x2='470.0' y2='200.0' stroke='#1E293B' stroke-width='1.4' /><rect x='50' y='140' width='70' height='60' fill='#F1F5F9' stroke='#1E293B' stroke-width='1.2'/><text x='85.0' y='218.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='12' font-weight='700' fill='#1E293B' >ν &lt; ν₀</text><text x='85.0' y='233.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='10.5' font-weight='600' fill='#475569' >no hay emisión</text><line x1='40.0' y1='110.0' x2='140.0' y2='110.0' stroke='#E11D48' stroke-width='1.6' stroke-dasharray='5 4'/><text x='40.0' y='104.0' text-anchor='start' font-family='Barlow, sans-serif' font-size='12' font-weight='700' fill='#BE123C' >W₀</text><rect x='200' y='110' width='70' height='90' fill='#F1F5F9' stroke='#1E293B' stroke-width='1.2'/><rect x='200' y='60' width='70' height='50' fill='#FFF1F2' stroke='#E11D48' stroke-width='1.4'/><text x='235.0' y='160.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='13' font-weight='700' fill='#1E293B' >W₀</text><text x='235.0' y='90.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='13' font-weight='700' fill='#BE123C' >E<tspan baseline-shift='sub' font-size='70%'>c</tspan></text><text x='235.0' y='218.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='12' font-weight='700' fill='#1E293B' >ν &gt; ν₀</text><text x='235.0' y='233.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='10.5' font-weight='600' fill='#475569' >emite un electrón</text><text x='330.0' y='120.0' text-anchor='start' font-family='Barlow, sans-serif' font-size='16' font-weight='700' fill='#1E293B' >h·ν = W₀ + E<tspan baseline-shift='sub' font-size='70%'>c</tspan></text><text x='330.0' y='145.0' text-anchor='start' font-family='Barlow, sans-serif' font-size='11' font-weight='600' fill='#475569' >La energía sobrante del</text><text x='330.0' y='160.0' text-anchor='start' font-family='Barlow, sans-serif' font-size='11' font-weight='600' fill='#475569' >fotón es la energía cinética</text><text x='330.0' y='175.0' text-anchor='start' font-family='Barlow, sans-serif' font-size='11' font-weight='600' fill='#475569' >del electrón.</text><text x='18.0' y='130.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='11' font-weight='600' fill='#475569' transform='rotate(-90 18 130)'>Energía del fotón</text></svg>
xt><text x='105.0' y='166.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='14.64' font-weight='700' fill='#1E293B' >ΔS<tspan baseline-shift='sub' font-size='70%'>c</tspan> = − Q / T<tspan baseline-shift='sub' font-size='70%'>c</tspan></text><text x='435.0' y='166.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='14.64' font-weight='700' fill='#1E293B' >ΔS<tspan baseline-shift='sub' font-size='70%'>f</tspan> = + Q / T<tspan baseline-shift='sub' font-size='70%'>f</tspan></text><text x='270.0' y='200.0' text-anchor='middle' font-family='Barlow, sans-serif' font-size='15.86' font-weight='700' fill='#BE123C' >Como T<tspan baseline-shift='sub' font-size='70%'>c</tspan> &gt; T<tspan baseline-shift='sub' font-size='70%'>f</tspan>:  Q/T<tspan baseline-shift='sub' font-size='70%'>f</tspan> &gt; Q/T<tspan baseline-shift='sub' font-size='70%'>c</tspan>  →  ΔS<tspan baseline-shift='sub' font-size='70%'>total</tspan> &gt; 0</text></svg>